name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript versions TSTyche downloads to type-test against (>=5.9).
      - name: Cache TypeScript versions for type tests
        uses: actions/cache@v6
        with:
          path: .tstyche
          key: tstyche-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: tstyche-

      - name: Check
        run: pnpm check

      - name: Check packed packages
        run: pnpm pack:check

  determinism:
    name: Determinism across engines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browsers match the playwright version in the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir packages/devtools exec playwright install --with-deps chromium webkit firefox

      # Cached browsers still need the system libraries they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir packages/devtools exec playwright install-deps chromium webkit firefox

      # Ops gives the same bits on every engine, and a replay plays the same in
      # every browser: this runs both claims on a committed netcode match.
      # Regenerate it with: node --import tsx integration/netcode/replay/record.ts
      - name: Verify the netcode replay on every engine
        run: pnpm --dir integration/netcode exec ritmo-devtools verify replay/target.ts replay/match.json --engines node,chromium,webkit,firefox

      # The check job skips these without browsers.
      - name: Browser engine tests
        run: pnpm vitest run packages/devtools/test/PlaywrightEngine.test.ts

  bench:
    name: Performance regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wall-clock numbers only compare on the same machine, so the base commit
      # is measured in this job using its own public-API benchmark suite.
      # Copying the head's suite would make a breaking API addition fail on
      # the base and silently disable the comparison for every runtime case.
      # Matching case names compare; new cases start with no runtime reference.
      - name: Benchmark base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p .bench
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git worktree add --detach .bench/base "$BASE_SHA"
            ln -s "$PWD/node_modules" .bench/base/node_modules
            cp scripts/bench.ts .bench/base/scripts/bench.ts
            (cd .bench/base && node --expose-gc --import tsx scripts/bench.ts --json ../base.json) \
              || echo "::warning::Base commit could not run the benchmark suite; runtime cases are not gated."
          else
            echo "::warning::No base commit available; runtime cases are not gated."
          fi

      # Runtime cases are compared with the base commit; type metrics are
      # deterministic and compared with packages/core/bench/baseline.json.
      # Type metric growth is advisory; runtime regressions still fail this job.
      - name: Benchmark head and compare
        run: pnpm bench --compare .bench/base.json --warn-types
