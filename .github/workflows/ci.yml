name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript versions TSTyche downloads to type-test against (>=5.9).
      - name: Cache TypeScript versions for type tests
        uses: actions/cache@v6
        with:
          path: .tstyche
          key: tstyche-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: tstyche-

      - name: Check
        run: pnpm check

      - name: Check packed packages
        run: pnpm pack:check

  determinism:
    name: Determinism across engines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browsers match the playwright version in the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir packages/devtools exec playwright install --with-deps chromium webkit firefox

      # Cached browsers still need the system libraries they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir packages/devtools exec playwright install-deps chromium webkit firefox

      # The committed netcode match aims and slows its shots through Ops (atan2,
      # cos, sin, exp), so this runs both claims on it: Ops gives the same bits
      # on every engine, and a replay plays the same in every browser.
      # Regenerate it with: node --import tsx integration/netcode/replay/record.ts
      - name: Verify the netcode replay on every engine
        run: pnpm --dir integration/netcode exec ritmo-devtools verify replay/target.ts replay/match.json --engines node,chromium,webkit,firefox

      # The check job skips these without browsers.
      - name: Browser engine tests
        run: pnpm vitest run packages/devtools/test/PlaywrightEngine.test.ts

  # Pull requests only: on main the change is already merged, so a result
  # there could not stop it.
  bench:
    name: Performance regressions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only code the bench runs can move its results: the packages (without
      # their docs, skills, type tests, and the version a release writes), the
      # integration games that have bench cases, the runner, the lockfile, and
      # this workflow.
      - name: Check for runtime changes
        id: changes
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- packages $(dirname integration/*/bench) scripts/bench.ts package.json pnpm-lock.yaml .github/workflows/ci.yml \
            ':(exclude)**/*.md' ':(exclude)packages/*/dtslint/**' ':(exclude)packages/core/skills/**' \
            ':(exclude)packages/*/package.json' ':(exclude)packages/devtools/src/internal/version.ts'; then
            echo "No runtime changes: benchmarks skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Results only compare on one machine, so the base commit is checked out
      # here and measured in turns with the head, using its own public-API
      # benchmark cases: copying the head's cases would make a breaking API
      # addition fail on the base. Only the runner and harness are the head's.
      # Matching case names compare; new cases start with no reference.
      - name: Check out the base commit
        if: steps.changes.outputs.run == 'true'
        run: |
          git worktree add --detach .bench/base "$BASE_SHA"
          ln -s "$PWD/node_modules" .bench/base/node_modules
          cp scripts/bench.ts .bench/base/scripts/bench.ts
          cp packages/core/bench/harness.ts .bench/base/packages/core/bench/harness.ts

      # Every case gates its allocations; critical cases also gate their time.
      # Type metrics are deterministic and compare with
      # packages/core/bench/baseline.json; their growth is advisory.
      - name: Benchmark head against base
        if: steps.changes.outputs.run == 'true'
        run: pnpm bench --against .bench/base --warn-types
