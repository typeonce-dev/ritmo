name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    # An unset RITMO_RELEASES_ENABLED variable pauses release automation (see .changeset/README.md).
    if: github.repository == 'typeonce-dev/ritmo' && vars.RITMO_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # .node-version is Node 24, which ships npm 11: it supports npm trusted
      # publishing (OIDC).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript versions TSTyche downloads to type-test against (>=5.9).
      - name: Cache TypeScript versions for type tests
        uses: actions/cache@v6
        with:
          path: .tstyche
          key: tstyche-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: tstyche-

      - name: Check
        run: pnpm check

      - name: Check packed packages
        run: pnpm pack:check

      # With pending changesets this opens or updates the "Version Packages"
      # pull request. Without them it publishes every package whose version is
      # not on npm yet, then pushes the release tags.
      #
      # Publishing authenticates with npm trusted publishing (OIDC): every
      # package trusts this repository, `release.yml`, and the `npm`
      # environment. No npm token is stored.
      - name: Version or publish
        id: changesets
        # v2 is the action for the Changesets v3 CLI. It pushes the version
        # commit and the release tags through the GitHub API with the job's
        # token, and reads what was published from CHANGESETS_OUTPUT, which
        # `pnpm release` passes down to `changeset publish`.
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version Packages
          commit-message: Version Packages

      # The website documents what is on npm, so it is deployed after a
      # publish, from the same commit (see website/README.md).
      - name: Build the website
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --dir website build

      - name: Deploy the website
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --dir website run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
