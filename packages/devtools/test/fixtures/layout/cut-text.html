<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  body { margin: 0; font: 16px sans-serif; }
  .box { position: absolute; left: 100px; top: 100px; width: 90px; overflow: hidden; white-space: nowrap; }
  /* Text for screen readers alone: clipped to a pixel on purpose, so it is not text a box cuts. */
  .unseen { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
</style>
<h1 class="unseen">Chapter Three</h1>
