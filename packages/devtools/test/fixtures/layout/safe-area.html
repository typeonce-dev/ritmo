<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  body { margin: 0; font: 16px sans-serif; }
  .edge { position: absolute; left: 8px; top: 100px; width: 80px; height: 48px; }
  .padded { position: absolute; left: max(8px, env(safe-area-inset-left)); top: 200px; width: 80px; height: 48px; }
  /* Tap anywhere to start: a control meant to fill the screen, its words inside the safe area. */
  .backdrop { position: fixed; inset: 0; border: 0; background: #234; color: #fff; font: inherit; }
</style>
<button class="backdrop">Tap to start</button>
<button class="edge" style="z-index:1">Menu</button>
<button class="padded" style="z-index:1">Map</button>
